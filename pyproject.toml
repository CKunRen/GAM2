[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gam2-mf"
version = "1.1.0"
description = "Dual-gated mixture-of-experts Bayesian neural network for fidelity-agnostic multi-fidelity modelling"
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy>=1.23", "scipy>=1.9", "scikit-learn>=1.2"]

[tool.setuptools.packages.find]
include = ["gam2*"]
